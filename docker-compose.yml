# ============================================
# EduBot — Docker Compose
# ============================================
# Run everything with: docker-compose up --build
# Stop with: docker-compose down

services:
  # ---- Backend API ----
  backend:
    build: ./backend
    container_name: edubot-backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-edubot-admin-key-change-me}
      - DATABASE_URL=sqlite:///data/chatbot.db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - RAG_SIMILARITY_THRESHOLD=0.35
      - DEBUG=false
      - LOG_LEVEL=INFO
    volumes:
      # Persist data between container restarts
      - backend-data:/app/data
    restart: unless-stopped

  # ---- Frontend ----
  frontend:
    build: ./frontend
    container_name: edubot-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:

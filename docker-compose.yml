# ============================================
# Eduzyra AI Chatbot — Docker Compose
# ============================================
#
# Usage:
#   docker compose up --build -d
#   docker compose ps
#   docker compose logs -f
#   docker compose down
# ============================================

services:
  # ---- Eduzyra AI Backend API ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduzyra-backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-edubot-admin-key-change-me}
      - DATABASE_URL=sqlite+aiosqlite:///data/chatbot.db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80,http://127.0.0.1:3000
      - RAG_SIMILARITY_THRESHOLD=0.35
      - DEBUG=false
      - LOG_LEVEL=INFO
    volumes:
      # Persistent volume for SQLite DB, uploads, and FAISS vectors
      - eduzyra-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ---- Eduzyra React Frontend ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduzyra-frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=/api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  eduzyra-data:
    driver: local
